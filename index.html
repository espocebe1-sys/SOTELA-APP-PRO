n);display:grid;place-items:center;font-weight:900}.mobile{display:none}.content{max-width:1320px;margin:auto;padding:32px clamp(18px,4vw,48px) 55px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.8px;font-weight:900;text-transform:uppercase}.head h1{font-size:clamp(27px,3.4vw,39px);line-height:1.12;letter-spacing:-1.1px;margin:8px 0}.head p{color:var(--muted);margin:0;max-width:720px}.hero{background:linear-gradient(120deg,#103c30,#187650);color:#fff;border-radius:25px;padding:clamp(25px,4vw,45px);min-height:265px;display:flex;align-items:center;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:330px;height:330px;border:1px solid #ffffff28;border-radius:50%;right:-65px;top:-70px;box-shadow:0 0 0 35px #ffffff08,0 0 0 75px #ffffff06}.heroinner{position:relative;z-index:1;max-width:660px}.hero .eyebrow{color:var(--lime)}.hero h2{font-size:clamp(30px,4.2vw,47px);line-height:1.08;letter-spacing:-1.5px;margin:12px 0}.hero p{color:#d6e9de;margin:0 0 23px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:800;transition:.18s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--green);color:white;box-shadow:0 5px 15px #12644720}.lime{background:var(--lime);color:var(--deep)}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff0ed;color:#a43c30}.whitebtn{background:white;color:var(--green)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:28px 0 14px}.sectionhead h2{font-size:19px;margin:0}.sectionhead p{font-size:13px;color:var(--muted);margin:3px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.panel,.card{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 12 <script>
const $=s=>document.querySelector(s), content=$('#content');
let page='home',marketType='TOUS';
let activeStoreId=localStorage.getItem('sotela_active_store')||'';
let user=JSON.parse(localStorage.getItem('sotela_user')||'{}');
let stores=JSON.parse(localStorage.getItem('sotela_stores')||'[]');

let recipes=JSON.parse(localStorage.getItem('sotela_recipes')||'[]');
let orders=JSON.parse(localStorage.getItem('sotela_orders')||'[]');
let consumer=JSON.parse(localStorage.getItem('sotela_consumer')||'null');
let channelAccount=channels[0]||null;

function go(p){page=p;$('#sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
function head(title,desc='',eyebrow='SOTELA'){return `<div class="head"><div><div class="eyebrow">${title=== 'SOTELA'?'SOTELA':eyebrow}</div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div></div>`}
function field(label,name,type='text',placeholder=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}"></div>`}
function tile(icon,title,desc,button,action){return `<article class="panel tile"><div class="tileicon">${icon}</div><h3>${title}</h3><p>${desc}</p><button class="btn primary" onclick="go('${action}')">${button}</button></article>`}

else if(page==='profile')content.innerHTML=head('Profil','Compte SOTELA','SOTELA')+`<div class="profilelayout"><section class="panel profilecard"><div class="bigavatar">${esc((user.prenom||user.nom||'S').slice(0,1).toUpperCase())}</div><h2>${esc([user.prenom,user.nom].filter(Boolean).join(' '))}</h2><p>${esc(user.activite||'')}</p><div class="profiledata">${[['Age',user.age],['Adresse personnelle',user.adresse],['Numéro WhatsApp',user.whatsapp],['Facebook',user.facebook],['Sexe',user.sexe]].map(([k,v])=>v?`<div><span>${k}</span>${esc(v)}</div>`:'').join('')}</div><button class="btn primary" style="margin-top:22px;width:100%" onclick="go('account')">modifier</button></section><section class="panel"><h2>VOS MAGASINS</h2><div class="emptyspace"></div><button class="btn secondary" onclick="go('stores')">VOS MAGASINS</button><button class="btn secondary" onclick="go('channel')">ENREGITRER VOTRE chaine de recette</button></section></div>`;

else if(page==='store')content.innerHTML=head('ENREGITRER VOTRE MAISON COMMERCIALE','CRÉER VOTRE ESPACE SOTELA','SOTELA')+`<form class="panel" id="storeForm"><h2>Vous êtes?</h2><div class="field"><label>Vous êtes?</label><select name="type" required><option value=""></option><option>SUPER-FOURNISSEUR</option><option>GROSSISTE</option><option>DETAILLANT</option></select></div><h2>CRÉER VOTRE ESPACE SOTELA</h2><div class="field"><label>LOGO COMMERCIAL</label><input type="file" name="logo" accept="image/*"></div><div class="formgrid">${field('Nom M.C:','nom','text','')}${field('CRÉER 1à3 CATEGORIES','categorie','text','')}${field('Adresse complète','adresse','text','')}${field('Contact','contact','tel','')}${field('WhatsApp','whatsapp','tel','')}${field('Facebook','facebook','text','')}${field('e-mail','email','email','')}</div><div class="formfooter"><button type="button" class="btn secondary" onclick="go('market')">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`;
else if(page==='stores')content.innerHTML=head('VOS MAGASINS','','SOTELA')+`<div class="grid">${renderStores(stores,true)}</div>`;

else if(page==='consumer')content.innerHTML=head('CONSO. FINAL','','LAMBA')+(consumer?`<section class="panel">${consumerProfile(consumer)}<div class="actions" style="margin-top:22px"><button class="btn secondary" onclick="go('recipes')">REGARDER RECETTE</button><button class="btn primary" onclick="go('orderchannels')">COMMANDER</button></div><div class="formfooter"><button class="btn secondary" onclick="editConsumer()">modifier</button></div></section>`:`<form class="panel" id="consumerForm"><h2>Vous êtes?</h2><div class="field"><label>Photo consommateur</label><input type="file" name="photo" accept="image/*"></div><p class="sub">CRÉER 1à4 CATEGORIES</p><div class="field"><label>Nom te Prénom</label><input name="nom" required></div><div class="field"><label>Adresse Domicile de livraison</label><textarea name="adresse" placeholder="Insérer votre domicile de livraison" required></textarea></div><div class="field"><label>WhatsApp</label><input name="whatsapp" type="tel"></div><div class="formfooter"><button class="btn primary">Enregistrer</button></div></form>`);

function activeStore(){return stores.find(s=>s.id===activeStoreId)||null}
function setActiveStore(id){activeStoreId=id||'';localStorage.setItem('sotela_active_store',activeStoreId);marketType='TOUS';render()}
function marketTabs(){const a=activeStore();let types=['SUPER-FOURNISSEUR','GROSSISTE','DETAILLANT'];if(a?.type==='DETAILLANT')types=['SUPER-FOURNISSEUR','GROSSISTE'];else if(a?.type==='GROSSISTE')types=['SUPER-FOURNISSEUR'];return ['TOUS',...types]}
function allowedSupplierTypes(){const a=activeStore();if(!a)return ['SUPER-FOURNISSEUR','GROSSISTE','DETAILLANT'];if(a.type==='DETAILLANT')return ['SUPER-FOURNISSEUR','GROSSISTE'];if(a.type==='GROSSISTE')return ['SUPER-FOURNISSEUR'];return ['SUPER-FOURNISSEUR','GROSSISTE','DETAILLANT'].filter(t=>t!==a.type)}
function renderMarketStores(){const a=activeStore();const types=allowedSupplierTypes();const arr=stores.filter(s=>s.id!==a?.id&&types.includes(s.type)&&(marketType==='TOUS'||s.type===marketType));return renderStores(arr,false)}
function renderStores(arr,owned=false){if(!arr.length)return `<div class="panel" style="grid-column:1/-1;text-align:center;padding:34px 20px"><div class="tileicon" style="margin:0 auto 12px">🏪</div><h3>${owned?'VOS MAGASINS':'Autres magasins selon catégories'}</h3><p>${owned?'Vos espaces apparaîtront ici après leur création par les utilisateurs.':'Aucun magasin correspondant pour le moment. Les magasins apparaîtront ici lorsque les utilisateurs auront créé leurs vrais espaces.'}</p>${owned?`<button class="btn primary" onclick="go('store')">CRÉER VOTRE ESPACE SOTELA</button>`:''}</div>`;return arr.map((s)=>`<article class="panel tile"><div class="tileicon">🏪</div><h3>${esc(s.nom)}</h3><p>${esc(s.type)}${s.categorie?' · '+esc(s.categorie):''}</p><p>${esc(s.adresse||'')}</p><div class="store-contact">${s.whatsapp?`<button class="btn secondary" data-number="${esc(s.whatsapp)}" onclick="contact(this.dataset.number)">WhatsApp</button>`:''}${s.facebook?`<button class="btn secondary" data-name="${esc(s.facebook)}" onclick="facebookSearch(this.dataset.name)">Facebook</button>`:''}</div>${owned?`<div class="actions"><button class="btn secondary" onclick="editStoreById('${esc(s.id)}')">modifier</button><button class="btn danger" onclick="removeStoreById('${esc(s.id)}')">x</button></div>`:''}</article>`).join('')}
function setType(t){marketType=t;render()}
function filterStores(){const q=$('#storeSearch').value.toLowerCase();const a=activeStore(),types=allowedSupplierTypes();let arr=stores.filter(s=>s.id!==a?.id&&types.includes(s.type)&&(marketType==='TOUS'||s.type===marketType)&&JSON.stringify(s).toLowerCase().includes(q));$('#storeGrid').innerHTML=renderStores(arr,false)}
function consumerProfile(c){return `<div class="profilelayout"><section class="panel profilecard"><div class="bigavatar">👤</div><h2>${esc(c.nom||'')}</h2><p>CONSO. FINAL</p><div class="profiledata"><div><span>Adresse Domicile de livraison</span>${esc(c.adresse||'')}</div>${c.whatsapp?`<div><span>WhatsApp</span>${esc(c.whatsapp)}</div>`:''}</div></section></div>`}
function editConsumer(){const c=consumer||{};consumer=null;go('consumer');const f=$('#consumerForm');if(f){['nom','adresse','whatsapp'].forEach(k=>{if(f.elements[k])f.elements[k].value=c[k]||''})}}
function renderChannelRecipes(c){const arr=recipes.filter(r=>r.channelId===c.id||(!r.channelId&&r.channelName===c.nom));if(!arr.length)return `<div class="panel" style="grid-column:1/-1;text-align:center;padding:24px"><p>Aucune recette publiée pour le moment.</p></div>`;return arr.map(r=>`<article class="panel tile"><h3>${esc(c.nom||'CANAL RECETTE')}</h3><p>${esc(r.texte||'')}</p>${r.lien?`<a href="${esc(r.lien)}" target="_blank" rel="noopener">Voir le lien de la recette</a>`:''}</article>`).join('')}
function renderPostedChannels(arr){const posted=channels.filter(c=>arr.some(r=>r.channelId===c.id||(!r.channelId&&r.channelName===c.nom)));if(!posted.length)return `<div class="panel" style="grid-column:1/-1;text-align:center;padding:34px 20px"><div class="tileicon" style="margin:0 auto 12px">🍲</div><h3>REGARDER RECETTE</h3><p>Aucun canal n’a encore publié de recette. Les canaux apparaîtront ici après leur publication.</p></div>`;return posted.map(c=>`<article class="panel tile"><div class="tileicon">🍲</div><h3>${esc(c.nom||'')}</h3><p>${esc(c.categorie||'')}</p><p>${arr.filter(r=>r.channelId===c.id||(!r.channelId&&r.channelName===c.nom)).length} recette(s) publiée(s)</p><div class="actions">${c.whatsapp?`<button class="btn secondary" data-number="${esc(c.whatsapp)}" onclick="contact(this.dataset.number)">WhatsApp</button>`:''}${c.facebook?`<button class="btn secondary" onclick="facebookSearch(this.dataset.name)" data-name="${esc(c.facebook)}">Facebook</button>`:''}</div></article>`).join('')}
function filterRecipes(){let q=$('#recipeSearch').value.toLowerCase();const posted=channels.filter(c=>recipes.some(r=>(r.channelId===c.id||(!r.channelId&&r.channelName===c.nom))&&(c.nom+' '+c.categorie+' '+r.texte).toLowerCase().includes(q)));$('#recipeGrid').innerHTML=renderPostedChannels(recipes.filter(r=>!q||(r.texte||'').toLowerCase().includes(q)||posted.some(c=>c.id===r.channelId||c.nom===r.channelName)))}
function renderOrderChannels(arr){if(!arr.length)return `<div class="panel" style="grid-column:1/-1;text-align:center;padding:34px 20px"><div class="tileicon" style="margin:0 auto 12px">🍽️</div><h3>COMMANDER</h3><p>Aucun canal recette ou restaurant n’est enregistré pour le moment. Les comptes créés apparaîtront ici.</p></div>`;return arr.map(c=>`<article class="panel tile"><div class="tileicon">🍽️</div><h3>${esc(c.nom||'')}</h3><p>${esc(c.type||'CANAL-RECETTE et RESTO')}</p><p>${esc(c.categorie||'')}</p><div class="actions">${c.whatsapp?`<button class="btn secondary" data-number="${esc(c.whatsapp)}" onclick="contact(this.dataset.number)">WhatsApp</button>`:''}${c.facebook?`<button class="btn secondary" data-name="${esc(c.facebook)}" onclick="facebookSearch(this.dataset.name)">Facebook</button>`:''}</div><button class="btn primary" onclick="order('${esc(c.nom)}')">COMMANDER</button></article>`).join('')}
function filterOrderChannels(){const q=$('#channelSearch').value.toLowerCase();$('#orderChannelGrid').innerHTML=renderOrderChannels(channels.filter(c=>(c.nom+' '+c.categorie+' '+c.type).toLowerCase().includes(q)))}
function removeStore(i){stores.splice(i,1);save();render();toast('Supprimé')}
function removeStoreById(id){const i=stores.findIndex(s=>s.id===id);if(i>=0){if(activeStoreId===id){activeStoreId='';localStorage.removeItem('sotela_active_store')}removeStore(i)}}
function editStore(i){let s=stores[i];go('store');let f=$('#storeForm');Object.keys(s).forEach(k=>{if(f.elements[k])f.elements[k].value=s[k]});f.dataset.edit=i}
function editStoreById(id){const i=stores.findIndex(s=>s.id===id);if(i>=0)editStore(i)}
function whatsappNumber(n){let d=String(n||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='243'+d.slice(1);return d}
function contact(n){const number=whatsappNumber(n);if(number)window.open('https://wa.me/'+number,'_blank');else toast('Numéro WhatsApp non renseigné')}
function facebookSearch(name){const q=String(name||'').trim();if(q)window.open('https://www.facebook.com/search/top?q='+encodeURIComponent(q),'_blank');else toast('Nom Facebook non renseigné')}
function order(n){orders.push({nom:n,date:new Date().toISOString()});save();toast('COMMANDER')}
document.querySelectorAll('#nav, #mobileBottom').forEach(nav=>nav.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)}));
document.addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#helpBtn').addEventListener('click',()=>toast('SOTELA'));
document.addEventListener('submit',e=>{
if(e.target.id==='accountForm'){e.preventDefault();let d=new FormData(e.target);['prenom','nom','sexe','age','activite','adresse','whatsapp','facebook'].forEach(k=>user[k]=d.get(k)||'');save();toast('Enregistrer');go('profile')}
if(e.target.id==='storeForm'){e.preventDefault();let d=new FormData(e.target),s={};['type','nom','categorie','adresse','contact','whatsapp','facebook','email'].forEach(k=>s[k]=d.get(k)||'');if(e.target.dataset.edit!==undefined){const i=+e.target.dataset.edit;s.id=stores[i]?.id||('store-'+Date.now());stores[i]=s}else{s.id='store-'+Date.now()+'-'+stores.length;stores.push(s)}save();toast('Enregistrer');go('stores')}
if(e.target.id==='channelForm'){e.preventDefault();if(channelAccount){toast('Un seul compte Canal Recette est autorisé');go('channel');return}let d=new FormData(e.target),s={id:'channel-'+Date.now()};['type','nom','categorie','tiktok','facebook','whatsapp','email'].forEach(k=>s[k]=d.get(k)||'');channelAccount=s;channels=[s];save();toast('Canal créé');go('lamba')}
if(e.target.id==='consumerForm'){e.preventDefault();let d=new FormData(e.target);consumer={nom:d.get('nom')||'',adresse:d.get('adresse')||'',whatsapp:d.get('whatsapp')||''};save();toast('Compte consommateur enregistré');go('consumer')}
if(e.target.id==='recipeForm'){e.preventDefault();if(!channelAccount){toast('Créez d’abord votre canal');go('channel');return}let d=new FormData(e.target);recipes.unshift({id:'recipe-'+Date.now(),channelId:channelAccount.id,channelName:channelAccount.nom,nom:channelAccount.nom,texte:d.get('texte')||'',lien:d.get('lien')||''});save();toast('Recette publiée');go('lamba')}
if(e.target.id==='shareForm'){e.preventDefault();toast('Poster')}
});
render();
